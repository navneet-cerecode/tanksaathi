AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TankSaathi - heat-aware rooftop tank and leak early warning. Team NicobarAndaman.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9]{2,8}$"
    Description: Lowercase letters and digits only (also used in IoT rule names).
  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Inbox for caretaker and escalation alerts (SNS sends a confirmation link).
  AppUrl:
    Type: String
    Default: http://127.0.0.1:5173
    Description: Base URL of the web app, used in alert links and CORS.
  IotDataEndpoint:
    Type: String
    Description: Account's IoT data endpoint (aws iot describe-endpoint --endpoint-type iot:Data-ATS).

  BedrockEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Off until Bedrock access is unblocked on this account; standard text is used meanwhile.


Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 15
    Handler: index.handler
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        EVENT_BUS_NAME: !Ref EventBus
        APP_URL: !Ref AppUrl
        NODE_OPTIONS: --enable-source-maps
    Tags:
      Project: TankSaathi
      Team: NicobarAndaman
      Stage: !Ref Stage

Resources:
  # ---------- Data ----------
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub tanksaathi-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub tanksaathi-${Stage}-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  # ---------- Ingestion ----------
  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/tanksaathi-${Stage}-ingest
      RetentionInDays: 7

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tanksaathi-${Stage}-ingest
      Description: Validates IoT telemetry, stores readings, recomputes tank state.
      CodeUri: dist/ingest
      LoggingConfig:
        LogGroup: !Ref IngestLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt DeadLetterQueue.Arn

  TelemetryRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub tanksaathi_${Stage}_telemetry
      TopicRulePayload:
        Description: Route tank telemetry to the ingest Lambda; park delivery failures in the DLQ.
        AwsIotSqlVersion: "2016-03-23"
        Sql: "SELECT *, topic() AS topic, clientid() AS clientId FROM 'tanksaathi/v1/+/+/+/reading'"
        RuleDisabled: false
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IngestFunction.Arn
        ErrorAction:
          Sqs:
            QueueUrl: !Ref DeadLetterQueue
            RoleArn: !GetAtt IotRuleErrorRole.Arn
            UseBase64: false

  IngestInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IngestFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt TelemetryRule.Arn
      SourceAccount: !Ref AWS::AccountId

  IotRuleErrorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: iot.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: send-to-dlq
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DeadLetterQueue.Arn
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  # ---------- Device identity ----------
  # One policy for every tank device. It reads the channel, building and tank
  # from the thing's registry attributes, which only an admin can set, so a
  # certificate can publish only to its own tank's topic on its own channel.
  DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub tanksaathi-${Stage}-device
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}"
            Condition:
              Bool: { iot:Connection.Thing.IsAttached: "true" }
          - Effect: Allow
            Action: iot:Publish
            Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/tanksaathi/v1/${!iot:Connection.Thing.Attributes[channel]}/${!iot:Connection.Thing.Attributes[buildingId]}/${!iot:Connection.Thing.Attributes[tankId]}/reading"

  SimulatorThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: sim-demo-hostel-a-roof-1
      AttributePayload:
        Attributes:
          channel: sim
          buildingId: demo-hostel-a
          tankId: roof-1

  # ---------- Incident workflow ----------
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub tanksaathi-${Stage}

  CaretakerTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub tanksaathi-${Stage}-caretaker
      DisplayName: TankSaathi
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  CaretakerSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CaretakerTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  EscalationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub tanksaathi-${Stage}-escalation
      DisplayName: TankSaathi escalation
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  EscalationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref EscalationTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  RegisterTokenLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/tanksaathi-${Stage}-register-token
      RetentionInDays: 7

  RegisterTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tanksaathi-${Stage}-register-token
      Description: Parks a Step Functions task token on the incident so the caretaker's action can resume it.
      CodeUri: dist/register-token
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref RegisterTokenLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt Table.Arn

  ExplainLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/tanksaathi-${Stage}-explain
      RetentionInDays: 7

  ExplainFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tanksaathi-${Stage}-explain
      Description: Attaches a plain-language EN/HI explanation to an incident (standard text, or Bedrock when enabled).
      CodeUri: dist/explain
      Timeout: 20
      LoggingConfig:
        LogGroup: !Ref ExplainLogGroup
      Environment:
        Variables:
          BEDROCK_ENABLED: !Ref BedrockEnabled
          BEDROCK_MODEL_ID: apac.amazon.nova-micro-v1:0
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-micro-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-micro-v1:0"

  IncidentStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub tanksaathi-${Stage}-incident
      Type: STANDARD
      DefinitionUri: statemachine/incident.asl.json
      DefinitionSubstitutions:
        TableName: !Ref Table
        CaretakerTopicArn: !Ref CaretakerTopic
        EscalationTopicArn: !Ref EscalationTopic
        RegisterTokenFunctionArn: !GetAtt RegisterTokenFunction.Arn
        ExplainFunctionArn: !GetAtt ExplainFunction.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt Table.Arn
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CaretakerTopic.TopicName
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt EscalationTopic.TopicName
        - LambdaInvokePolicy:
            FunctionName: !Ref RegisterTokenFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ExplainFunction
      Events:
        IncidentOpened:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source: [tanksaathi.ingest]
              detail-type: [IncidentOpened]
            RetryPolicy:
              MaximumRetryAttempts: 4
              MaximumEventAgeInSeconds: 3600
            DeadLetterConfig:
              Arn: !GetAtt DeadLetterQueue.Arn
      Tags:
        Project: TankSaathi
        Team: NicobarAndaman

  DeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref DeadLetterQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EventBridgeTargetFailures
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt DeadLetterQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/tanksaathi-${Stage}/*"

  # ---------- Identity and API ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub tanksaathi-${Stage}
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: buildingId
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: { MinLength: "1", MaxLength: "48" }
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      UserPoolTags:
        Project: TankSaathi
        Team: NicobarAndaman

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub tanksaathi-${Stage}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      # Users can read their building but never change it.
      ReadAttributes: [email, name, custom:buildingId]
      WriteAttributes: [name]
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  CaretakerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: caretaker, Description: Runs the building's tanks and incidents }
  ResidentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: resident, Description: Sees the simplified building status }
  DemoOperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: demo-operator, Description: Drives the sensor simulator on demo buildings }

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]
      CorsConfiguration:
        # Plain list: SAM drops a CorsConfiguration built with !If.
        AllowOrigins: [!Ref AppUrl, "http://localhost:5173"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Tags:
        Project: TankSaathi
        Team: NicobarAndaman

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/tanksaathi-${Stage}-api
      RetentionInDays: 7

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tanksaathi-${Stage}-api
      Description: Caretaker, resident and demo-operator API. Cedar authorizes every request.
      CodeUri: dist/api
      MemorySize: 512
      Timeout: 20
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          IOT_DATA_ENDPOINT: !Ref IotDataEndpoint
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess]
              Resource: "*"
            - Effect: Allow
              Action: [states:StopExecution]
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:tanksaathi-${Stage}-incident:*"
            - Effect: Allow
              Action: iot:Publish
              Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/tanksaathi/v1/sim/demo-*"
      Events:
        Me: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /me, Method: GET } }
        Status: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/status", Method: GET } }
        Tank: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/tanks/{tankId}", Method: GET } }
        Incidents: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/incidents", Method: GET } }
        Incident: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/incidents/{incidentId}", Method: GET } }
        IncidentAction: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/incidents/{incidentId}/actions", Method: POST } }
        Refill: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/refill", Method: PUT } }
        Scenario: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/demo/scenarios", Method: POST } }
        Reset: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/demo/reset", Method: POST } }

  # ---------- Web hosting ----------
  WebApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub tanksaathi-${Stage}
      Description: TankSaathi web app (manual deploys from web/dist). Team NicobarAndaman.
      Platform: WEB
      CustomRules:
        # Single-page app: send every path without a file extension to index.html.
        - Source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|webp|webmanifest)$)([^.]+$)/>'
          Target: /index.html
          Status: "200"
      CustomHeaders: |
        customHeaders:
          - pattern: '**'
            headers:
              - key: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - key: X-Content-Type-Options
                value: nosniff
              - key: Referrer-Policy
                value: strict-origin-when-cross-origin
              - key: X-Frame-Options
                value: DENY
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  WebBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt WebApp.AppId
      BranchName: main
      Stage: PRODUCTION
      EnableAutoBuild: false

  # ---------- Observability ----------
  OpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub tanksaathi-${Stage}-ops
      DisplayName: TankSaathi ops
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  OpsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OpsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub tanksaathi-${Stage}-dlq-not-empty
      AlarmDescription: A telemetry message or workflow event failed and is parked in the DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt DeadLetterQueue.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  IngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub tanksaathi-${Stage}-ingest-errors
      AlarmDescription: The ingest Lambda threw an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref IngestFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  WorkflowFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub tanksaathi-${Stage}-workflow-failed
      AlarmDescription: An incident workflow failed or was never acknowledged.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions: [{ Name: StateMachineArn, Value: !Ref IncidentStateMachine }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub tanksaathi-${Stage}-api-5xx
      AlarmDescription: The API returned server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub TankSaathi-${Stage}
      DashboardBody: !Sub '{"widgets":[{"type":"text","x":0,"y":0,"width":24,"height":2,"properties":{"markdown":"## TankSaathi (${Stage}) · Team NicobarAndaman\nSimulated tank telemetry → IoT Core → Lambda → DynamoDB → EventBridge → Step Functions → SNS. All readings here come from the sensor simulator."}},{"type":"metric","x":0,"y":2,"width":8,"height":6,"properties":{"title":"Telemetry (readings)","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries","metrics":[["TankSaathi","ReadingsAccepted","service","ingest"],[".","ReadingsRejected",".","."],[".","TelemetryRejected",".","."]]}},{"type":"metric","x":8,"y":2,"width":8,"height":6,"properties":{"title":"Incidents","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries","metrics":[["TankSaathi","IncidentsOpened","service","ingest"],[".","IncidentAcknowledged",".","api"],[".","IncidentResolved",".","api"]]}},{"type":"metric","x":16,"y":2,"width":8,"height":6,"properties":{"title":"Incident workflow (Step Functions)","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries","metrics":[["AWS/States","ExecutionsStarted","StateMachineArn","${IncidentStateMachine}"],[".","ExecutionsSucceeded",".","."],[".","ExecutionsFailed",".","."],[".","ExecutionsAborted",".","."]]}},{"type":"metric","x":0,"y":8,"width":8,"height":6,"properties":{"title":"Lambda errors","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries","metrics":[["AWS/Lambda","Errors","FunctionName","${IngestFunction}"],["...","${ApiFunction}"],["...","${RegisterTokenFunction}"],["...","${ExplainFunction}"]]}},{"type":"metric","x":8,"y":8,"width":8,"height":6,"properties":{"title":"API requests and denials","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries","metrics":[["AWS/ApiGateway","Count","ApiId","${HttpApi}"],[".","4xx",".","."],[".","5xx",".","."],["TankSaathi","AuthorizationDenied","service","api"]]}},{"type":"metric","x":16,"y":8,"width":8,"height":6,"properties":{"title":"DLQ depth and simulator runs","region":"${AWS::Region}","stat":"Maximum","period":60,"view":"timeSeries","metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${DeadLetterQueue.QueueName}"],["TankSaathi","SimulatorRuns","service","api",{"stat":"Sum","period":300}]]}},{"type":"alarm","x":0,"y":14,"width":24,"height":3,"properties":{"title":"Alarms","alarms":["${DeadLetterAlarm.Arn}","${IngestErrorAlarm.Arn}","${WorkflowFailureAlarm.Arn}","${ApiErrorAlarm.Arn}"]}}]}'

Outputs:
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/TankSaathi-${Stage}
  WebAppId:
    Value: !GetAtt WebApp.AppId
  WebUrl:
    Value: !Sub https://main.${WebApp.DefaultDomain}
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  EventBusName:
    Value: !Ref EventBus
  IncidentStateMachineArn:
    Value: !Ref IncidentStateMachine
  TableName:
    Value: !Ref Table
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  IngestFunctionName:
    Value: !Ref IngestFunction
  DevicePolicyName:
    Value: !Ref DevicePolicy
  SimulatorThingName:
    Value: !Ref SimulatorThing
