AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TankSaathi - heat-aware rooftop tank and leak early warning. Team NicobarAndaman.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9]{2,8}$"
    Description: Lowercase letters and digits only (also used in IoT rule names).
  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Inbox for caretaker and escalation alerts (SNS sends a confirmation link).
  AppUrl:
    Type: String
    Default: http://localhost:5173
    Description: Base URL of the web app, used in alert links.
  IotDataEndpoint:
    Type: String
    Description: Account's IoT data endpoint (aws iot describe-endpoint --endpoint-type iot:Data-ATS).

Conditions:
  AppIsLocal: !Equals [!Ref AppUrl, "http://localhost:5173"]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 15
    Handler: index.handler
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        EVENT_BUS_NAME: !Ref EventBus
        APP_URL: !Ref AppUrl
        NODE_OPTIONS: --enable-source-maps
    Tags:
      Project: TankSaathi
      Team: NicobarAndaman
      Stage: !Ref Stage

Resources:
  # ---------- Data ----------
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub tanksaathi-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub tanksaathi-${Stage}-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  # ---------- Ingestion ----------
  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/tanksaathi-${Stage}-ingest
      RetentionInDays: 7

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tanksaathi-${Stage}-ingest
      Description: Validates IoT telemetry, stores readings, recomputes tank state.
      CodeUri: dist/ingest
      LoggingConfig:
        LogGroup: !Ref IngestLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt DeadLetterQueue.Arn

  TelemetryRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub tanksaathi_${Stage}_telemetry
      TopicRulePayload:
        Description: Route tank telemetry to the ingest Lambda; park delivery failures in the DLQ.
        AwsIotSqlVersion: "2016-03-23"
        Sql: "SELECT *, topic() AS topic, clientid() AS clientId FROM 'tanksaathi/v1/+/+/+/reading'"
        RuleDisabled: false
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IngestFunction.Arn
        ErrorAction:
          Sqs:
            QueueUrl: !Ref DeadLetterQueue
            RoleArn: !GetAtt IotRuleErrorRole.Arn
            UseBase64: false

  IngestInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IngestFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt TelemetryRule.Arn
      SourceAccount: !Ref AWS::AccountId

  IotRuleErrorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: iot.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: send-to-dlq
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DeadLetterQueue.Arn
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  # ---------- Device identity ----------
  # One policy for every tank device. It reads the channel, building and tank
  # from the thing's registry attributes, which only an admin can set, so a
  # certificate can publish only to its own tank's topic on its own channel.
  DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub tanksaathi-${Stage}-device
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}"
            Condition:
              Bool: { iot:Connection.Thing.IsAttached: "true" }
          - Effect: Allow
            Action: iot:Publish
            Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/tanksaathi/v1/${!iot:Connection.Thing.Attributes[channel]}/${!iot:Connection.Thing.Attributes[buildingId]}/${!iot:Connection.Thing.Attributes[tankId]}/reading"

  SimulatorThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: sim-demo-hostel-a-roof-1
      AttributePayload:
        Attributes:
          channel: sim
          buildingId: demo-hostel-a
          tankId: roof-1

  # ---------- Incident workflow ----------
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub tanksaathi-${Stage}

  CaretakerTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub tanksaathi-${Stage}-caretaker
      DisplayName: TankSaathi
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  CaretakerSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CaretakerTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  EscalationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub tanksaathi-${Stage}-escalation
      DisplayName: TankSaathi escalation
      Tags:
        - { Key: Project, Value: TankSaathi }
        - { Key: Team, Value: NicobarAndaman }

  EscalationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref EscalationTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  RegisterTokenLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/tanksaathi-${Stage}-register-token
      RetentionInDays: 7

  RegisterTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tanksaathi-${Stage}-register-token
      Description: Parks a Step Functions task token on the incident so the caretaker's action can resume it.
      CodeUri: dist/register-token
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref RegisterTokenLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt Table.Arn

  IncidentStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub tanksaathi-${Stage}-incident
      Type: STANDARD
      DefinitionUri: statemachine/incident.asl.json
      DefinitionSubstitutions:
        TableName: !Ref Table
        CaretakerTopicArn: !Ref CaretakerTopic
        EscalationTopicArn: !Ref EscalationTopic
        RegisterTokenFunctionArn: !GetAtt RegisterTokenFunction.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt Table.Arn
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CaretakerTopic.TopicName
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt EscalationTopic.TopicName
        - LambdaInvokePolicy:
            FunctionName: !Ref RegisterTokenFunction
      Events:
        IncidentOpened:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source: [tanksaathi.ingest]
              detail-type: [IncidentOpened]
            RetryPolicy:
              MaximumRetryAttempts: 4
              MaximumEventAgeInSeconds: 3600
            DeadLetterConfig:
              Arn: !GetAtt DeadLetterQueue.Arn
      Tags:
        Project: TankSaathi
        Team: NicobarAndaman

  DeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref DeadLetterQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EventBridgeTargetFailures
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt DeadLetterQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/tanksaathi-${Stage}/*"

  # ---------- Identity and API ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub tanksaathi-${Stage}
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: buildingId
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: { MinLength: "1", MaxLength: "48" }
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      UserPoolTags:
        Project: TankSaathi
        Team: NicobarAndaman

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub tanksaathi-${Stage}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      # Users can read their building but never change it.
      ReadAttributes: [email, name, custom:buildingId]
      WriteAttributes: [name]
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  CaretakerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: caretaker, Description: Runs the building's tanks and incidents }
  ResidentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: resident, Description: Sees the simplified building status }
  DemoOperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: demo-operator, Description: Drives the sensor simulator on demo buildings }

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]
      CorsConfiguration:
        AllowOrigins: !If [AppIsLocal, ["http://localhost:5173"], [!Ref AppUrl, "http://localhost:5173"]]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Tags:
        Project: TankSaathi
        Team: NicobarAndaman

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/tanksaathi-${Stage}-api
      RetentionInDays: 7

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tanksaathi-${Stage}-api
      Description: Caretaker, resident and demo-operator API. Cedar authorizes every request.
      CodeUri: dist/api
      MemorySize: 512
      Timeout: 20
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          IOT_DATA_ENDPOINT: !Ref IotDataEndpoint
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess]
              Resource: "*"
            - Effect: Allow
              Action: [states:StopExecution]
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:tanksaathi-${Stage}-incident:*"
            - Effect: Allow
              Action: iot:Publish
              Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/tanksaathi/v1/sim/demo-*"
      Events:
        Me: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /me, Method: GET } }
        Status: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/status", Method: GET } }
        Tank: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/tanks/{tankId}", Method: GET } }
        Incidents: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/incidents", Method: GET } }
        Incident: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/incidents/{incidentId}", Method: GET } }
        IncidentAction: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/incidents/{incidentId}/actions", Method: POST } }
        Refill: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/refill", Method: PUT } }
        Scenario: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/demo/scenarios", Method: POST } }
        Reset: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/buildings/{buildingId}/demo/reset", Method: POST } }

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  EventBusName:
    Value: !Ref EventBus
  IncidentStateMachineArn:
    Value: !Ref IncidentStateMachine
  TableName:
    Value: !Ref Table
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  IngestFunctionName:
    Value: !Ref IngestFunction
  DevicePolicyName:
    Value: !Ref DevicePolicy
  SimulatorThingName:
    Value: !Ref SimulatorThing
